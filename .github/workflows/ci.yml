name: CI

# PR と main への merge では走らせない。npm run verify は本番への反映（deploy ブランチ）のときに Deploy がまとめて確かめ、
# merge の条件は手元の確認の記録にする（Lazyturtle0852 の決定、2026-11-22。todo/humans/2026-11-22-merge-guard-runner-offline.md）。
# 手で確かめたいときだけ、Actions の画面から走らせる。重い確認を飛ばす変更の決めは scripts/harness/lib/verify-local.mjs の LIGHT_PATHS
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      # ブラウザ用の Maps キー。リファラと API を制限してある。リポジトリには置かない
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run setup
      # ローカルと同じコマンドで、Emulator 上の確認まで行う
      - run: npm run verify
