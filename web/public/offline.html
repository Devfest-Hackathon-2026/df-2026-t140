<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f3f5" />
    <title>たびむすび</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f1f3f5; color: #1f2a24; font-family: "Hiragino Maru Gothic ProN", sans-serif; text-align: center; line-height: 1.7; }
      button { font: inherit; font-weight: 700; padding: 12px 24px; border: 0; border-radius: 14px; background: #1f9638; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <div id="offline-ja">
        <p>インターネットにつながっていません。<br />電波のよいところで、もう一度開いてください。</p>
        <button type="button" onclick="location.reload()">もう一度開く</button>
      </div>
      <div id="offline-en" hidden>
        <p>You’re offline.<br />Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
    <script>
      const requested = new URLSearchParams(location.search).get('lang')
      let language = requested
      if (!language) {
        try { language = localStorage.getItem('app-language') } catch { /* Use Japanese when storage is unavailable. */ }
      }
      if (language === 'en') {
        document.documentElement.lang = 'en'
        document.title = 'Tabimusubi'
        document.getElementById('offline-ja').hidden = true
        document.getElementById('offline-en').hidden = false
      }
    </script>
  </body>
</html>
